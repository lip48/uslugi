<style>
:root{
  --ac:#f5b352;          /* золото */
  --ac2:#63d9ff;         /* лёд */
  --ink:#eae6db;
  --dim:rgba(234,230,219,.55);
  --bg:#04060c;
  --panel:rgba(9,13,22,.58);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{overflow:hidden}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Unbounded',system-ui,'Segoe UI',sans-serif;
  height:100dvh;overflow:hidden;
  -webkit-tap-highlight-color:transparent;
}
.hidden{display:none!important}

/* сцена на весь экран */
#stage{position:fixed;inset:0;z-index:0}
#stage canvas{display:block;width:100%;height:100%}

/* лёгкое затемнение по краям — чтобы текст читался */
#shade{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse at 50% 45%,transparent 40%,rgba(4,6,12,.55) 100%)}

/* заголовок */
#masthead{position:fixed;top:calc(22px + env(safe-area-inset-top));left:24px;z-index:10;pointer-events:none;max-width:70vw;
  opacity:0;transform:translateY(-10px);transition:opacity 1.4s ease .3s,transform 1.4s ease .3s}
body.ready #masthead{opacity:1;transform:none}
#masthead .overline{font-size:9.5px;letter-spacing:.34em;color:var(--dim);text-transform:uppercase}
#masthead h1{margin:8px 0 6px;font-family:'Marcellus',serif;font-weight:400;
  font-size:clamp(28px,4.4vw,46px);letter-spacing:.30em;color:#f4efe2;
  text-shadow:0 0 34px rgba(245,179,82,.4)}
#masthead .sub{font-size:clamp(10px,1.3vw,12.5px);letter-spacing:.24em;color:var(--dim)}
#masthead .sub b{color:var(--ac);font-weight:600}
#masthead .rule{width:130px;height:1px;margin-top:12px;background:linear-gradient(90deg,var(--ac),transparent)}

/* кнопки справа сверху */
#tools{position:fixed;top:calc(16px + env(safe-area-inset-top));right:16px;z-index:10;display:flex;gap:8px;
  opacity:0;transition:opacity 1.2s ease .8s}
body.ready #tools{opacity:1}
.tool{height:40px;min-width:40px;border-radius:12px;cursor:pointer;background:var(--panel);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.10);color:var(--dim);
  display:grid;place-items:center;padding:0 12px;text-decoration:none;font-size:.8rem;
  transition:color .3s,border-color .3s,box-shadow .3s,transform .15s}
.tool:hover{color:var(--ink);border-color:rgba(245,179,82,.45);box-shadow:0 0 18px rgba(245,179,82,.22)}
.tool:active{transform:scale(.93)}
.tool.on{color:var(--ac);border-color:rgba(245,179,82,.55)}
.tool svg{width:18px;height:18px}

/* подпись внизу */
#foot{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));z-index:10;
  text-align:center;pointer-events:none;opacity:0;transition:opacity 1.4s ease 1.1s}
body.ready #foot{opacity:1}
#foot .line{font-family:'Marcellus',serif;font-size:clamp(13px,2.4vw,17px);letter-spacing:.16em;color:rgba(234,230,219,.72)}
#foot .tiny{margin-top:6px;font-size:9.5px;letter-spacing:.22em;color:rgba(190,205,230,.38);text-transform:uppercase}

/* завеса загрузки */
#veil{position:fixed;inset:0;z-index:50;background:var(--bg);display:grid;place-items:center;align-content:center;gap:18px;
  transition:opacity 1.1s ease,visibility 1.1s}
#veil.gone{opacity:0;visibility:hidden}
#veil .vring{width:54px;height:54px;border-radius:50%;border:1px solid rgba(245,179,82,.25);border-top-color:var(--ac);
  animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#veil h2{font-family:'Marcellus',serif;font-weight:400;letter-spacing:.34em;font-size:20px;color:#f4efe2}
#veilStatus{font-size:11px;letter-spacing:.16em;color:var(--dim);text-align:center;max-width:80vw;line-height:1.7}
#veilStatus.err{color:#ff9a8a}
#veilRetry{margin-top:4px;padding:10px 24px;border-radius:30px;border:1px solid rgba(245,179,82,.5);
  background:transparent;color:var(--ac);cursor:pointer;font-family:inherit;font-size:.85rem}
#veilRetry:hover{background:rgba(245,179,82,.12)}

@media (max-width:600px){
  #masthead{left:18px;max-width:62vw}
  #foot .line{letter-spacing:.1em}
}
@media (prefers-reduced-motion:reduce){
  #veil .vring{animation:none}
}

<script type="module">
const LIB = /* glsl */`
vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
float snoise(vec3 v){
  const vec2 C=vec2(1.0/6.0,1.0/3.0);
  const vec4 D=vec4(0.0,0.5,1.0,2.0);
  vec3 i=floor(v+dot(v,C.yyy));
  vec3 x0=v-i+dot(i,C.xxx);
  vec3 g=step(x0.yzx,x0.xyz);
  vec3 l=1.0-g;
  vec3 i1=min(g.xyz,l.zxy);
  vec3 i2=max(g.xyz,l.zxy);
  vec3 x1=x0-i1+C.xxx;
  vec3 x2=x0-i2+C.yyy;
  vec3 x3=x0-D.yyy;
  i=mod289(i);
  vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
  float n_=0.142857142857;
  vec3 ns=n_*D.wyz-D.xzx;
  vec4 j=p-49.0*floor(p*ns.z*ns.z);
  vec4 x_=floor(j*ns.z);
  vec4 y_=floor(j-7.0*x_);
  vec4 x=x_*ns.x+ns.yyyy;
  vec4 y=y_*ns.x+ns.yyyy;
  vec4 h=1.0-abs(x)-abs(y);
  vec4 b0=vec4(x.xy,y.xy);
  vec4 b1=vec4(x.zw,y.zw);
  vec4 s0=floor(b0)*2.0+1.0;
  vec4 s1=floor(b1)*2.0+1.0;
  vec4 sh=-step(h,vec4(0.0));
  vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy;
  vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
  vec3 p0=vec3(a0.xy,h.x);
  vec3 p1=vec3(a0.zw,h.y);
  vec3 p2=vec3(a1.xy,h.z);
  vec3 p3=vec3(a1.zw,h.w);
  vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
  p0*=norm.x;p1*=norm.y;p2*=norm.z;p3*=norm.w;
  vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0);
  m=m*m;
  return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
}
vec3 hash33(vec3 p){
  p=fract(p*vec3(0.1031,0.1030,0.0973));
  p+=dot(p,p.yxz+33.33);
  return fract((p.xxy+p.yxx)*p.zyx);
}
float hash12(vec2 p){
  vec3 p3=fract(vec3(p.xyx)*0.1031);
  p3+=dot(p3,p3.yzx+33.33);
  return fract((p3.x+p3.y)*p3.z);
}
float fbm(vec3 p){
  float f=0.0,a=0.5;
  for(int i=0;i<5;i++){ f+=a*snoise(p); p=p*2.02+vec3(11.5,7.3,5.1); a*=0.5; }
  return f;
}
float fbm3(vec3 p){
  float f=0.0,a=0.5;
  for(int i=0;i<3;i++){ f+=a*snoise(p); p=p*2.03+vec3(9.7,3.1,7.7); a*=0.5; }
  return f;
}
float ridge(vec3 p){
  float f=0.0,a=0.5;
  for(int i=0;i<4;i++){ f+=a*(1.0-abs(snoise(p))); p=p*2.1+vec3(3.7,9.2,1.9); a*=0.5; }
  return f;
}
vec2 voronoi(vec3 p, float t){
  vec3 ip=floor(p), fp=fract(p);
  float f1=8.0, f2=8.0;
  for(int z=-1;z<=1;z++)
  for(int y=-1;y<=1;y++)
  for(int x=-1;x<=1;x++){
    vec3 g=vec3(float(x),float(y),float(z));
    vec3 o=hash33(ip+g);
    o=0.5+0.5*sin(t+6.2831*o);
    vec3 r=g+o-fp;
    float d=dot(r,r);
    if(d<f1){ f2=f1; f1=d; } else if(d<f2){ f2=d; }
  }
  return sqrt(vec2(f1,f2));
}
`;

/* процедурное окружение для отражений металла */
const ENV = /* glsl */`
vec3 spaceEnv(vec3 d, float rough, vec3 keyC, vec3 fillC){
  float r=clamp(rough,0.0,1.0);
  vec3 col=vec3(0.012,0.02,0.038)*(1.0-0.5*r);
  float b1=pow(max(dot(d,normalize(vec3(0.62,0.34,0.5))),0.0),mix(90.0,7.0,r));
  float b2=pow(max(dot(d,normalize(vec3(-0.55,-0.08,-0.62))),0.0),mix(60.0,6.0,r));
  float hor=pow(1.0-abs(d.y),mix(30.0,4.0,r));
  col+=keyC*b1*2.4+fillC*b2*1.3;
  col+=mix(keyC,fillC,0.5)*hor*0.22;
  vec3 g=floor(d*140.0);
  float s=step(0.9985,hash12(g.xy+g.z*7.7));
  col+=vec3(0.8,0.9,1.0)*s*(1.0-r)*0.5;
  return col;
}
`;

/* --- общий блок частиц: размер / размытие по глубине --- */
const P_HEAD = /* glsl */`
uniform float uTime,uEnergy,uPixelScale,uFocus,uAperture,uBokeh,uMinPx,uAlpha,uSizeMul,uFog;
uniform vec3 uKeyColor,uFillColor,uAccentA,uAccentB;
attribute vec4 aSeed;
varying vec3 vColor;
varying float vAlpha,vSoft,vFlare;
void finalize(vec3 wp, float sizeW, float alpha){
  vec4 vp=viewMatrix*vec4(wp,1.0);
  float vz=max(-vp.z,0.001);
  float coc=clamp(abs(vz-uFocus)/vz*uAperture,0.0,1.0)*uBokeh;
  float px=sizeW*uSizeMul*(1.0+coc*5.0)*uPixelScale/vz;
  gl_PointSize=clamp(px,uMinPx,120.0);
  vSoft=coc;
  vAlpha=alpha/(1.0+coc*coc*20.0);
  vAlpha*=smoothstep(1.2,3.6,vz);
  vAlpha*=exp(-max(vz-38.0,0.0)*uFog);
  gl_Position=projectionMatrix*vp;
}
`;

/* фоновая версия: без реакции на курсор */
const DISTURB = /* glsl */`
vec3 disturb(vec3 wp, inout float glow){
  return wp;
}
`;

const P_FRAG = /* glsl */`
varying vec3 vColor;
varying float vAlpha,vSoft,vFlare;
void main(){
  vec2 pc=gl_PointCoord*2.0-1.0;
  float r=length(pc);
  if(r>1.0) discard;
  float core=exp(-r*r*mix(7.0,1.8,vSoft));
  float halo=exp(-r*2.6)*(0.22+0.5*vSoft);
  float a=(core+halo)*vAlpha*(1.0-smoothstep(0.8,1.0,r));
  if(vFlare>0.5){
    float fx=pow(max(0.0,1.0-abs(pc.x)*3.0),4.0);
    float fy=pow(max(0.0,1.0-abs(pc.y)*3.0),4.0);
    a+=(fx+fy)*exp(-r*1.5)*vAlpha*0.5;
  }
  gl_FragColor=vec4(vColor,a);
}
`;

/* --- ядро: обсидиан + расплавленные трещины --- */
const CORE_V = /* glsl */`
uniform float uTime,uEnergy,uRes,uDetail;
varying vec3 vN,vWp,vOp;
varying float vDisp;
` + LIB + /* glsl */`
float dispf(vec3 p){
  if(uDetail>0.5){
    float f=fbm(p*0.8+vec3(0.0,uTime*0.02,0.0));
    float rg=ridge(p*1.6+vec3(uTime*0.012,0.0,0.0));
    return (f*0.2+(rg-0.5)*0.16)*(0.85+uEnergy*0.3);
  }
  float f=fbm3(p*0.8+vec3(0.0,uTime*0.02,0.0));
  return (f*0.26)*(0.85+uEnergy*0.3);
}
void main(){
  vec3 n=normalize(normal);
  vec3 up=(abs(n.y)>0.94)?vec3(1.0,0.0,0.0):vec3(0.0,1.0,0.0);
  vec3 t=normalize(cross(n,up));
  vec3 b=normalize(cross(n,t));
  float e=0.09;
  float d0=dispf(position);
  vec3 p0=position+n*d0;
  vec3 pA=position+t*e; pA+=n*dispf(pA);
  vec3 pB=position+b*e; pB+=n*dispf(pB);
  vec3 nn=normalize(cross(pA-p0,pB-p0));
  p0*=1.0+uRes*0.03;
  vOp=position; vDisp=d0;
  vN=normalize(mat3(modelMatrix)*nn);
  vec4 wp=modelMatrix*vec4(p0,1.0);
  vWp=wp.xyz;
  gl_Position=projectionMatrix*viewMatrix*wp;
}
`;

const CORE_F = /* glsl */`
uniform float uTime,uEnergy,uRes,uDetail;
uniform vec3 uKeyColor,uFillColor,uHotColor,uMidColor,uDeepColor;
varying vec3 vN,vWp,vOp;
varying float vDisp;
` + LIB + ENV + /* glsl */`
void main(){
  vec3 N=normalize(vN);
  vec3 V=normalize(cameraPosition-vWp);
  vec3 p=vOp;
  vec3 up2=(abs(N.y)>0.94)?vec3(1.0,0.0,0.0):vec3(0.0,1.0,0.0);
  vec3 T=normalize(cross(N,up2));
  vec3 B=normalize(cross(N,T));
  float be=0.05;
  float h0=fbm3(p*5.5);
  float metal;
  if(uDetail>0.5){
    float hx=fbm3((p+T*be)*5.5);
    float hy=fbm3((p+B*be)*5.5);
    N=normalize(N-((hx-h0)*T+(hy-h0)*B)*1.4);
    metal=smoothstep(0.15,0.6,fbm3(p*2.0+vec3(11.0)));
  } else {
    metal=smoothstep(0.15,0.6,h0);
  }
  float rough=clamp(mix(0.62,0.24,metal)+h0*0.08,0.08,0.9);
  vec3 albedo=mix(vec3(0.016,0.018,0.026),vec3(0.052,0.056,0.066),metal);
  albedo*=0.8+0.4*smoothstep(-0.4,0.5,vDisp*4.0);
  /* трещины: искажение поля + Voronoi */
  vec3 q=p+fbm3(p*0.7+vec3(0.0,uTime*0.03,0.0))*0.6;
  vec2 v1=voronoi(q*1.15+vec3(3.7),uTime*0.12);
  float e1=v1.y-v1.x;
  float m1=smoothstep(-0.25,0.35,fbm3(p*0.9-vec3(3.1)));
  float c1=(1.0-smoothstep(0.0,0.10,e1))*m1;
  float c2=0.0; float e2=1.0;
  if(uDetail>0.5){
    vec2 v2=voronoi(q*2.9+vec3(9.2),uTime*0.1);
    e2=v2.y-v2.x;
    c2=(1.0-smoothstep(0.0,0.07,e2))*smoothstep(0.2,0.6,fbm3(p*1.4+vec3(7.7)))*0.7;
  }
  float crack=max(c1,c2);
  float flow=0.62+0.38*sin(uTime*0.7+fbm3(q*1.5)*8.0);
  float breathe=0.88+0.12*sin(uTime*0.21);
  float eScale=(0.3+uEnergy*1.6)*breathe*(1.0+uRes*1.6);
  vec3 emis=mix(uDeepColor,uMidColor,smoothstep(0.05,0.55,crack));
  emis=mix(emis,uHotColor,pow(crack,3.0)*flow);
  emis*=crack*flow*eScale*2.6;
  emis+=uMidColor*(1.0-smoothstep(0.0,0.3,min(e1,e2)))*m1*0.1*eScale;
  /* основной свет тёплый, заполняющий холодный */
  vec3 L1=normalize(vec3(0.55,0.62,0.45));
  vec3 L2=normalize(vec3(-0.6,-0.28,-0.52));
  float nd1=max(dot(N,L1),0.0), nd2=max(dot(N,L2),0.0);
  vec3 col=albedo*(uKeyColor*nd1*1.15+uFillColor*nd2*0.5+vec3(0.02,0.03,0.05));
  vec3 H=normalize(L1+V);
  float ndv=max(dot(N,V),0.0);
  float F=0.04+0.96*pow(1.0-ndv,5.0);
  col+=uKeyColor*pow(max(dot(N,H),0.0),mix(50.0,220.0,1.0-rough))*F*(1.0-rough)*1.2;
  vec3 R=reflect(-V,N);
  vec3 F0=mix(vec3(0.04),vec3(0.55,0.56,0.6),metal);
  col+=spaceEnv(R,rough,uKeyColor,uFillColor)*(F0+(1.0-F0)*pow(1.0-ndv,5.0))*0.85;
  float fres=pow(1.0-ndv,3.2);
  col+=uFillColor*fres*0.32+uKeyColor*fres*fres*0.18;
  col+=emis;
  gl_FragColor=vec4(col,1.0);
}
`;

/* --- кольца: насечки, разрывы, световоды --- */
const RING_V = /* glsl */`
attribute float aFace;
varying vec2 vUv2;
varying vec3 vN,vWp;
varying float vFace;
void main(){
  vUv2=uv; vFace=aFace;
  vN=normalize(mat3(modelMatrix)*normal);
  vec4 wp=modelMatrix*vec4(position,1.0);
  vWp=wp.xyz;
  gl_Position=projectionMatrix*viewMatrix*wp;
}
`;
const RING_F = /* glsl */`
uniform float uTime,uEnergy,uRes,uTicks,uPhase,uFlowDir;
uniform vec3 uKeyColor,uFillColor,uAccentA,uAccentB,uTint;
varying vec2 vUv2;
varying vec3 vN,vWp;
varying float vFace;
` + LIB + ENV + /* glsl */`
void main(){
  vec3 N=normalize(vN);
  vec3 V=normalize(cameraPosition-vWp);
  float u=vUv2.x, v=vUv2.y;
  float rough=0.3;
  vec3 albedo=uTint;
  vec3 emis=vec3(0.0);
  float energy=0.35+uEnergy*1.5;
  if(vFace<1.5){
    float g1=(1.0-smoothstep(0.0,0.05,abs(v-0.22)))+(1.0-smoothstep(0.0,0.05,abs(v-0.78)));
    float g2=1.0-smoothstep(0.0,0.03,abs(v-0.5));
    float groove=max(g1*0.7,g2);
    float id=floor(u*uTicks);
    float tk=fract(u*uTicks);
    float maj=1.0-step(0.5,mod(id,8.0));
    float line=1.0-step(0.12,tk);
    float t1=line*(1.0-step(0.06+maj*0.12,abs(v-0.16)));
    float t2=line*(1.0-step(0.06+maj*0.12,abs(v-0.84)));
    float tick=max(t1,t2);
    albedo*=1.0-tick*0.55;
    albedo*=1.0-groove*0.35;
    rough+=groove*0.25+tick*0.2;
    float rune=step(0.93,hash12(vec2(id,7.0)));
    emis+=uAccentA*rune*t1*(0.5+0.5*sin(uTime*1.3+id))*energy*0.8;
  } else if(vFace<3.5){
    float line=1.0-smoothstep(0.02,0.16,abs(v-0.5));
    float pulse=0.4+0.6*pow(0.5+0.5*sin(u*25.1327*uFlowDir-uTime*1.6+uPhase),2.0);
    emis+=mix(uAccentA,uAccentB,0.25)*line*pulse*energy*(1.1+uRes*2.0);
    float rib=step(0.5,fract(u*uTicks*0.5));
    albedo*=0.85+0.15*rib;
    rough+=rib*0.12;
  } else {
    emis+=uAccentA*(0.9+0.4*sin(uTime*2.2+uPhase))*energy*1.2;
    albedo*=0.5;
  }
  rough=clamp(rough,0.12,0.8);
  vec3 L1=normalize(vec3(0.55,0.62,0.45));
  vec3 L2=normalize(vec3(-0.6,-0.28,-0.52));
  float ndv=max(dot(N,V),0.0);
  vec3 F0=clamp(albedo,0.0,1.0);
  vec3 Fs=F0+(1.0-F0)*pow(1.0-ndv,5.0);
  vec3 col=albedo*0.18*(uKeyColor*max(dot(N,L1),0.0)*1.1+uFillColor*max(dot(N,L2),0.0)*0.5+vec3(0.02,0.03,0.05));
  col+=spaceEnv(reflect(-V,N),rough,uKeyColor,uFillColor)*Fs*1.35;
  vec3 H=normalize(L1+V);
  col+=uKeyColor*pow(max(dot(N,H),0.0),mix(30.0,160.0,1.0-rough))*Fs*1.2;
  float fres=pow(1.0-ndv,3.0);
  col+=(uKeyColor*0.5+uFillColor*0.6)*fres*0.5;
  col+=emis;
  gl_FragColor=vec4(col,1.0);
}
`;

/* --- deep space фон и ореол --- */
const BG_V = /* glsl */`
varying vec3 vDir;
void main(){ vDir=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }
`;
const BG_F = /* glsl */`
uniform float uTime,uEnergy,uRes;
uniform vec3 uNebA,uNebB,uKeyColor,uFillColor;
varying vec3 vDir;
` + LIB + /* glsl */`
void main(){
  vec3 d=normalize(vDir);
  vec3 col=mix(vec3(0.012,0.02,0.045),vec3(0.002,0.004,0.010),smoothstep(-0.6,0.7,d.y));
  float n1=fbm3(d*2.4+vec3(0.0,uTime*0.004,0.0));
  float n2=fbm3(d*4.1-vec3(uTime*0.003,0.0,7.0));
  float band1=pow(1.0-abs(dot(d,normalize(vec3(0.18,1.0,0.12)))),2.5);
  float band2=pow(max(dot(d,normalize(vec3(-0.7,0.25,-0.5))),0.0),2.0);
  float amp=0.6+uEnergy*0.6+uRes*0.15;
  col+=uNebA*pow(max(n1,0.0),2.2)*band1*0.14*amp;
  col+=uNebB*pow(max(n2,0.0),2.4)*band2*0.10*amp;
  col+=uKeyColor*pow(1.0-abs(d.y),9.0)*0.02;
  col+=vec3(hash12(d.xy*541.7+d.z*173.3)-0.5)*0.006;
  gl_FragColor=vec4(max(col,vec3(0.0)),1.0);
}
`;
const HALO_V = /* glsl */`
varying vec2 vUv2;
void main(){ vUv2=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }
`;
const HALO_F = /* glsl */`
uniform float uTime,uEnergy,uRes;
uniform vec3 uKeyColor,uFillColor;
varying vec2 vUv2;
` + LIB + /* glsl */`
void main(){
  vec2 p=vUv2*2.0-1.0;
  float r=length(vec2(p.x,p.y*1.45));
  float glow=exp(-r*3.0)*0.5+exp(-r*8.0)*0.4;
  vec2 dn=p/max(r,0.001);
  float rays=pow(max(snoise(vec3(dn*2.6,r*2.0-uTime*0.06)),0.0),3.0)*exp(-r*2.2)*0.35;
  float amp=0.35+uEnergy*0.75+uRes*1.2;
  vec3 col=(uKeyColor*0.8+uFillColor*0.3)*glow+uKeyColor*rays;
  float a=1.0-smoothstep(0.55,1.0,r);
  gl_FragColor=vec4(col*amp,a);
}
`;

/* --- финальная цветокоррекция: ACES / виньетка / зерно --- */
const GRADE = {
  uniforms:{
    tDiffuse:{value:null}, uTime:{value:0}, uExposure:{value:1.2},
    uVignette:{value:.42}, uGrain:{value:.028}, uCA:{value:.0032},
    uRes:{value:null}
  },
  vertexShader:/* glsl */`
varying vec2 vUv;
void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }
`,
  fragmentShader:/* glsl */`
uniform sampler2D tDiffuse;
uniform float uTime,uExposure,uVignette,uGrain,uCA;
uniform vec2 uRes;
varying vec2 vUv;
vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.0,1.0); }
float ghash(vec2 p){ vec3 p3=fract(vec3(p.xyx)*0.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
void main(){
  vec2 uv=vUv;
  vec2 cc=uv-0.5;
  float r2=dot(cc,cc);
  vec2 off=cc*r2*uCA;
  vec3 col;
  col.r=texture2D(tDiffuse,uv+off).r;
  col.g=texture2D(tDiffuse,uv).g;
  col.b=texture2D(tDiffuse,uv-off).b;
  col*=uExposure;
  col=aces(col);
  float l=dot(col,vec3(0.299,0.587,0.114));
  col=mix(col,col*vec3(0.96,1.0,1.06),(1.0-smoothstep(0.0,0.45,l))*0.5);
  col=mix(col,col*vec3(1.04,1.0,0.97),smoothstep(0.5,1.0,l)*0.4);
  col*=1.0-uVignette*smoothstep(0.15,0.75,r2);
  col+=(ghash(uv*uRes+vec2(uTime*61.7,uTime*83.3))-0.5)*uGrain*(0.4+0.6*(1.0-l));
  col=pow(max(col,vec3(0.0)),vec3(1.0/2.2));
  gl_FragColor=vec4(col,1.0);
}
`
};

/* --- вершинные шейдеры частиц --- */
const DUST_MAIN = /* glsl */`
void main(){
  float r=length(position.xz);
  float w=0.16*pow(6.0/max(r,3.0),0.6)*(0.55+0.9*uEnergy);
  float th=atan(position.z,position.x)+uTime*w;
  vec3 lp=vec3(cos(th)*r,position.y+sin(uTime*0.3+aSeed.y*6.2831)*0.15,sin(th)*r);
  vec3 wp=(modelMatrix*vec4(lp,1.0)).xyz;
  float glow=0.0; wp=disturb(wp,glow);
  float warm=clamp((r-6.0)/22.0,0.0,1.0);
  vColor=mix(uAccentA,uAccentB,clamp(warm*0.75+aSeed.z*0.35,0.0,1.0));
  vColor*=(0.5+uEnergy*0.9)*(0.55+aSeed.w*0.7)*(1.0+glow);
  vFlare=0.0;
  float tw=0.85+0.15*sin(uTime*(0.4+aSeed.y)+aSeed.z*40.0);
  finalize(wp,(0.05+aSeed.x*0.12)*(1.0+min(glow,2.5)*0.35),uAlpha*tw);
}
`;
const STREAM_DECL = /* glsl */`uniform float uSpeed,uPhase,uFlowDir;`;
const STREAM_MAIN = /* glsl */`
void main(){
  float r=length(position.xz);
  float th=atan(position.z,position.x)+uTime*uSpeed*(0.5+0.9*uEnergy);
  vec3 lp=vec3(cos(th)*r,position.y,sin(th)*r);
  vec3 wp=(modelMatrix*vec4(lp,1.0)).xyz;
  float glow=0.0; wp=disturb(wp,glow);
  float pk=pow(0.5+0.5*sin(th*4.0-uTime*1.7*uFlowDir+uPhase+aSeed.y*1.5),3.0);
  vColor=mix(uAccentA,uAccentB,aSeed.z*0.5)*(0.3+0.8*pk)*(0.5+uEnergy*1.1)*(1.0+glow*1.2);
  vFlare=0.0;
  finalize(wp,(0.045+aSeed.x*0.075)*(1.0+min(glow,2.5)*0.4),uAlpha*(0.5+0.5*pk));
}
`;
const STAR_MAIN = /* glsl */`
void main(){
  vec3 wp=(modelMatrix*vec4(position,1.0)).xyz;
  float glow=0.0; wp=disturb(wp,glow);
  float tw=0.72+0.28*sin(uTime*(0.3+aSeed.y*1.2)+aSeed.z*40.0);
  vec3 base=mix(vec3(0.62,0.74,1.0),vec3(1.0,0.85,0.62),aSeed.z);
  base=mix(base,vec3(0.92,0.95,1.0),0.4);
  vColor=mix(base,uFillColor,0.18)*(0.5+0.5*tw)*(0.65+uEnergy*0.5)*(1.0+glow*0.7);
  vFlare=step(0.965,aSeed.w);
  finalize(wp,0.10+aSeed.x*aSeed.x*0.24,uAlpha*tw);
}
`;
const MOTE_MAIN = /* glsl */`
void main(){
  vec3 lp=position+vec3(sin(uTime*0.05+aSeed.y*6.2831),cos(uTime*0.04+aSeed.z*6.2831),sin(uTime*0.06+aSeed.w*6.2831))*1.6;
  vec3 wp=(modelMatrix*vec4(lp,1.0)).xyz;
  float glow=0.0; wp=disturb(wp,glow);
  vColor=mix(uKeyColor,uFillColor,aSeed.z)*(0.4+uEnergy*0.5)*(1.0+glow);
  vFlare=0.0;
  finalize(wp,(0.28+aSeed.x*0.6)*(1.0+min(glow,2.5)*0.3),uAlpha*(0.6+0.4*sin(uTime*0.2+aSeed.y*9.0)));
}
`;

/* ============================================================
   ФОНОВАЯ СЦЕНА: ядро + 3 кольца + пыль + звёзды.
   Без панели управления — всё крутится само.
============================================================ */
const TAU = Math.PI*2;
const isCoarse = matchMedia('(pointer:coarse)').matches;
const reduced  = matchMedia('(prefers-reduced-motion:reduce)').matches;
const lowTier  = isCoarse || (navigator.hardwareConcurrency && navigator.hardwareConcurrency<=6) || (navigator.deviceMemory && navigator.deviceMemory<=4);

const veil=document.getElementById('veil');
const veilStatus=document.getElementById('veilStatus');
const veilRetry=document.getElementById('veilRetry');
veilRetry.addEventListener('click',()=>location.reload());

(async()=>{
try{
  const THREE = await import('three');
  const [{EffectComposer},{RenderPass},{UnrealBloomPass},{ShaderPass},{FXAAShader}] = await Promise.all([
    import('three/addons/postprocessing/EffectComposer.js'),
    import('three/addons/postprocessing/RenderPass.js'),
    import('three/addons/postprocessing/UnrealBloomPass.js'),
    import('three/addons/postprocessing/ShaderPass.js'),
    import('three/addons/shaders/FXAAShader.js')
  ]);
  init(THREE,EffectComposer,RenderPass,UnrealBloomPass,ShaderPass,FXAAShader);
}catch(err){
  console.error(err);
  veilStatus.textContent='Не удалось загрузить сцену. Нужен интернет и браузер с WebGL2.';
  veilStatus.classList.add('err');
  veilRetry.classList.remove('hidden');
}
})();

function init(THREE,EffectComposer,RenderPass,UnrealBloomPass,ShaderPass,FXAAShader){

/* --- рендерер --- */
const renderer=new THREE.WebGLRenderer({antialias:false,alpha:false,stencil:false,powerPreference:'high-performance'});
if(!renderer.capabilities.isWebGL2) throw new Error('WebGL2 required');
renderer.toneMapping=THREE.NoToneMapping;
renderer.setClearColor(0x000000,1);
document.getElementById('stage').appendChild(renderer.domElement);
const canvas=renderer.domElement;
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();veil.classList.remove('gone');veilStatus.textContent='Восстанавливаю графику…';});
canvas.addEventListener('webglcontextrestored',()=>location.reload());

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,500);
const TARGET=new THREE.Vector3(0,.1,0);

/* --- качество: на телефоне заметно скромнее --- */
const COUNT = lowTier
  ? {dust:9000, stream:900, stars:5200, motes:700}
  : {dust:34000,stream:2600,stars:14000,motes:2600};
const basePR = Math.min(devicePixelRatio||1, lowTier?1.15:1.75);
let scale = lowTier ? .72 : 1;
const ENERGY=.62;

/* --- seeded random --- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rng=mulberry32(0xC0FFEE ^ 20261112);
const gauss=()=>{let u=0,v=0;while(u===0)u=rng();while(v===0)v=rng();return Math.sqrt(-2*Math.log(u))*Math.cos(TAU*v)};

/* --- палитра: золото + лёд --- */
const PAL={hot:'#ffedc2',mid:'#ff9a3a',deep:'#57150a',key:'#ffc773',fill:'#5cd7ff',a:'#ffb84d',b:'#63d9ff',nebA:'#8a5a20',nebB:'#1c4a66'};
const TINTS=['#a8aec0','#c49a58','#8a90a4'];
const shared={
  uTime:{value:0},uEnergy:{value:ENERGY},uRes:{value:0},
  uPixelScale:{value:1000},uFocus:{value:26},uDetail:{value:lowTier?0:1},
  uKeyColor:{value:new THREE.Color(PAL.key)},uFillColor:{value:new THREE.Color(PAL.fill)},
  uHotColor:{value:new THREE.Color(PAL.hot)},uMidColor:{value:new THREE.Color(PAL.mid)},uDeepColor:{value:new THREE.Color(PAL.deep)},
  uAccentA:{value:new THREE.Color(PAL.a)},uAccentB:{value:new THREE.Color(PAL.b)},
  uNebA:{value:new THREE.Color(PAL.nebA)},uNebB:{value:new THREE.Color(PAL.nebB)}
};

/* --- небо --- */
const bg=new THREE.Mesh(new THREE.SphereGeometry(300,32,20),
  new THREE.ShaderMaterial({uniforms:Object.assign({},shared),vertexShader:BG_V,fragmentShader:BG_F,side:THREE.BackSide,depthWrite:false}));
bg.renderOrder=-5;bg.frustumCulled=false;scene.add(bg);

/* --- ядро --- */
const coreGeo=new THREE.SphereGeometry(4, lowTier?110:200, lowTier?76:140);
coreGeo.boundingSphere=new THREE.Sphere(new THREE.Vector3(),4.8);
const core=new THREE.Mesh(coreGeo,new THREE.ShaderMaterial({uniforms:Object.assign({},shared),vertexShader:CORE_V,fragmentShader:CORE_F}));
core.rotation.x=.1;scene.add(core);

/* --- геометрия кольца: грани + рёбра + торцы --- */
function buildRing(R,w,t,arcs,seg=260){
  const pos=[],nor=[],uv=[],face=[],idx=[];
  const ri=R-w/2, ro=R+w/2, h=t/2;
  function quad(a,b,c,d,n,u0,u1,v0,v1,f){
    const base=pos.length/3;
    [a,b,c,d].forEach(p=>{pos.push(p[0],p[1],p[2]);nor.push(n[0],n[1],n[2]);face.push(f);});
    uv.push(u0,v0, u1,v0, u1,v1, u0,v1);
    idx.push(base,base+1,base+2, base,base+2,base+3);
  }
  arcs.forEach(arc=>{
    const a0=arc[0],a1=arc[1];
    const n=Math.max(2,Math.round(seg*(a1-a0)/TAU));
    for(let i=0;i<n;i++){
      const t0=a0+(a1-a0)*i/n, t1=a0+(a1-a0)*(i+1)/n;
      const u0=t0/TAU, u1=t1/TAU;
      const c0=Math.cos(t0),s0=Math.sin(t0),c1=Math.cos(t1),s1=Math.sin(t1);
      const nm=[(c0+c1)*.5,0,(s0+s1)*.5];
      quad([c0*ri,h,s0*ri],[c1*ri,h,s1*ri],[c1*ro,h,s1*ro],[c0*ro,h,s0*ro],[0,1,0],u0,u1,0,1,1);
      quad([c0*ri,-h,s0*ri],[c0*ro,-h,s0*ro],[c1*ro,-h,s1*ro],[c1*ri,-h,s1*ri],[0,-1,0],u0,u1,0,1,1);
      quad([c0*ro,-h,s0*ro],[c1*ro,-h,s1*ro],[c1*ro,h,s1*ro],[c0*ro,h,s0*ro],nm,u0,u1,0,1,3);
      quad([c0*ri,-h,s0*ri],[c0*ri,h,s0*ri],[c1*ri,h,s1*ri],[c1*ri,-h,s1*ri],[-nm[0],0,-nm[2]],u0,u1,0,1,3);
    }
    [[a0,-1],[a1,1]].forEach(cap=>{
      const a=cap[0],dir=cap[1],c=Math.cos(a),s=Math.sin(a);
      quad([c*ri,-h,s*ri],[c*ro,-h,s*ro],[c*ro,h,s*ro],[c*ri,h,s*ri],[-s*dir,0,c*dir],0,1,0,1,5);
    });
  });
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3));
  g.setAttribute('normal',new THREE.BufferAttribute(new Float32Array(nor),3));
  g.setAttribute('uv',new THREE.BufferAttribute(new Float32Array(uv),2));
  g.setAttribute('aFace',new THREE.BufferAttribute(new Float32Array(face),1));
  g.setIndex(new THREE.BufferAttribute(new Uint32Array(idx),1));
  g.computeBoundingSphere();
  return g;
}

const RINGS=[
  {R:6.3, w:.55,t:.15, tilt:[.46,0,.20],     speed:.055, phase:0,  ticks:96, flow:1, arcs:[[.10,2.55],[2.85,5.05],[5.30,6.18]]},
  {R:8.15,w:.42,t:.12, tilt:[-.72,.42,-.30], speed:-.038,phase:2.1,ticks:128,flow:-1,arcs:[[.35,3.40],[3.75,6.05]]},
  {R:10.4,w:.62,t:.17, tilt:[1.12,-.35,.62], speed:.024, phase:4.4,ticks:160,flow:1, arcs:[[0,1.95],[2.30,4.35],[4.65,6.10]]}
];

function pointsMat(main,opts){
  return new THREE.ShaderMaterial({
    uniforms:Object.assign({},shared,{
      uAlpha:{value:opts.alpha},uAperture:{value:opts.ap},uBokeh:{value:opts.bokeh},
      uMinPx:{value:opts.minPx},uSizeMul:{value:1},uFog:{value:opts.fog||0}
    },opts.extra||{}),
    vertexShader:P_HEAD+(opts.decl||'')+DISTURB+main,
    fragmentShader:P_FRAG,
    transparent:true,depthWrite:false,depthTest:true,blending:THREE.AdditiveBlending
  });
}
function makePoints(n,fill,mat){
  const p=new Float32Array(n*3),s=new Float32Array(n*4);
  for(let i=0;i<n;i++) fill(i,p,s);
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(p,3));
  g.setAttribute('aSeed',new THREE.BufferAttribute(s,4));
  const pts=new THREE.Points(g,mat);pts.frustumCulled=false;return pts;
}
const seed4=(s,i)=>{s[i*4]=rng();s[i*4+1]=rng();s[i*4+2]=rng();s[i*4+3]=Math.pow(rng(),1.5)};

const assembly=new THREE.Group();scene.add(assembly);
const ringMeshes=[];
RINGS.forEach((cfg,ri)=>{
  const grp=new THREE.Group();grp.rotation.set(...cfg.tilt);assembly.add(grp);
  const mat=new THREE.ShaderMaterial({
    uniforms:Object.assign({},shared,{
      uTint:{value:new THREE.Color(TINTS[ri])},
      uTicks:{value:cfg.ticks},uPhase:{value:cfg.phase},uFlowDir:{value:cfg.flow}
    }),
    vertexShader:RING_V,fragmentShader:RING_F,side:THREE.DoubleSide
  });
  const mesh=new THREE.Mesh(buildRing(cfg.R,cfg.w,cfg.t,cfg.arcs,lowTier?170:260),mat);
  mesh.rotation.y=cfg.phase;grp.add(mesh);ringMeshes.push(mesh);
  const sm=pointsMat(STREAM_MAIN,{alpha:.95,ap:.45,bokeh:.35,minPx:.9,fog:.01,decl:STREAM_DECL,
    extra:{uSpeed:{value:cfg.speed*4+.12*cfg.flow},uPhase:{value:cfg.phase},uFlowDir:{value:cfg.flow}}});
  const sp=makePoints(COUNT.stream,(i,p,s)=>{
    const th=rng()*TAU,r=cfg.R+gauss()*.1;
    p[i*3]=Math.cos(th)*r;p[i*3+1]=gauss()*.07;p[i*3+2]=Math.sin(th)*r;seed4(s,i);
  },sm);
  sp.renderOrder=3;grp.add(sp);
});

/* --- спиральный диск пыли --- */
const disk=new THREE.Group();disk.rotation.set(.14,0,-.06);scene.add(disk);
const dust=makePoints(COUNT.dust,(i,p,s)=>{
  let r,th,y;
  if(rng()<.28){r=5.2+Math.pow(rng(),.7)*29;th=rng()*TAU;y=gauss()*(.5+r*.05);}
  else{const arm=Math.floor(rng()*3);r=5.2+Math.pow(rng(),.62)*28.8;th=arm*TAU/3+r*.26+gauss()*.34*(.6+r*.02);y=gauss()*(.3+r*.042);}
  p[i*3]=Math.cos(th)*r;p[i*3+1]=y;p[i*3+2]=Math.sin(th)*r;seed4(s,i);
},pointsMat(DUST_MAIN,{alpha:.5,ap:.8,bokeh:.85,minPx:.8,fog:.012}));
dust.renderOrder=2;disk.add(dust);

/* --- дальние звёзды --- */
const sky=new THREE.Group();scene.add(sky);
const nb=new THREE.Vector3(.35,.85,.3).normalize();
const stars=makePoints(COUNT.stars,(i,p,s)=>{
  const z=rng()*2-1,ph=rng()*TAU,xy=Math.sqrt(1-z*z);
  const d=new THREE.Vector3(xy*Math.cos(ph),z,xy*Math.sin(ph));
  if(rng()<.45){d.addScaledVector(nb,-d.dot(nb)*.82).normalize();}
  const r=100+rng()*70;
  p[i*3]=d.x*r;p[i*3+1]=d.y*r;p[i*3+2]=d.z*r;seed4(s,i);
},pointsMat(STAR_MAIN,{alpha:.95,ap:0,bokeh:0,minPx:1,fog:0}));
stars.renderOrder=1;sky.add(stars);

/* --- ближние размытые пылинки --- */
const moteGrp=new THREE.Group();scene.add(moteGrp);
const motes=makePoints(COUNT.motes,(i,p,s)=>{
  const z=rng()*2-1,ph=rng()*TAU,xy=Math.sqrt(1-z*z);
  const r=10+Math.pow(rng(),.8)*34;
  p[i*3]=xy*Math.cos(ph)*r;p[i*3+1]=z*r*.7;p[i*3+2]=xy*Math.sin(ph)*r;seed4(s,i);
},pointsMat(MOTE_MAIN,{alpha:.15,ap:1.5,bokeh:1,minPx:1,fog:.008}));
motes.renderOrder=4;moteGrp.add(motes);

/* --- ореол --- */
const halo=new THREE.Mesh(new THREE.PlaneGeometry(34,34),new THREE.ShaderMaterial({
  uniforms:Object.assign({},shared),vertexShader:HALO_V,fragmentShader:HALO_F,
  transparent:true,depthWrite:false,blending:THREE.AdditiveBlending}));
halo.renderOrder=1;halo.frustumCulled=false;scene.add(halo);

/* --- постобработка: свечение → цветокоррекция → сглаживание --- */
const hdrOK=!!renderer.extensions.get('EXT_color_buffer_float');
const composer=hdrOK?new EffectComposer(renderer)
  :new EffectComposer(renderer,new THREE.WebGLRenderTarget(1,1,{type:THREE.UnsignedByteType}));
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),.8,.55,.72);
composer.addPass(bloom);
GRADE.uniforms.uRes.value=new THREE.Vector2(1,1);
const gradePass=new ShaderPass(GRADE);composer.addPass(gradePass);
const fxaaPass=new ShaderPass(FXAAShader);composer.addPass(fxaaPass);

function applySize(){
  const w=innerWidth,h=innerHeight,pr=basePR*scale;
  renderer.setPixelRatio(pr);renderer.setSize(w,h,false);
  composer.setPixelRatio(pr);composer.setSize(w,h);
  fxaaPass.material.uniforms.resolution.value.set(1/(w*pr),1/(h*pr));
  gradePass.uniforms.uRes.value.set(w*pr,h*pr);
  shared.uPixelScale.value=(h*pr)*.5/Math.tan(THREE.MathUtils.degToRad(camera.fov*.5));
  camera.aspect=w/h;camera.updateProjectionMatrix();
}
applySize();
let rz=null;
addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(applySize,150)});

/* --- музыка: только по кнопке (браузеры запрещают автозапуск со звуком) --- */
const music=document.getElementById('music');
const btnMusic=document.getElementById('btnMusic');
const mOn=document.getElementById('icMusicOn'), mOff=document.getElementById('icMusicOff');
function setMusicUI(on){
  btnMusic.classList.toggle('on',on);
  btnMusic.setAttribute('aria-pressed',String(on));
  mOn.classList.toggle('hidden',!on);
  mOff.classList.toggle('hidden',on);
  btnMusic.title=on?'Выключить музыку':'Включить музыку';
}
music.volume=.5;
btnMusic.addEventListener('click',()=>{
  if(music.paused){
    setMusicUI(true);
    const p=music.play();
    if(p&&p.catch) p.catch(()=>setMusicUI(false));
  } else { music.pause(); setMusicUI(false); }
});
music.addEventListener('error',()=>btnMusic.classList.add('hidden'));
/* нет файла музыки — кнопка прячется; есть — пробуем включить сразу */
fetch('music.mp3',{method:'HEAD'}).then(r=>{
  if(!r.ok){btnMusic.classList.add('hidden');return;}
  const p=music.play();
  if(p&&p.then) p.then(()=>setMusicUI(true)).catch(()=>setMusicUI(false));
}).catch(()=>btnMusic.classList.add('hidden'));

/* --- камера: медленный облёт --- */
const DEF_POS=new THREE.Vector3(9.2,6.8,23.5);
const A0=Math.atan2(DEF_POS.x,DEF_POS.z);
const R0=Math.hypot(DEF_POS.x,DEF_POS.z);
camera.position.copy(DEF_POS).multiplyScalar(reduced?1:1.5);
camera.lookAt(TARGET);
let intro=reduced?1:0;
const easeOut=x=>1-Math.pow(1-x,3);

/* --- главный цикл --- */
let last=performance.now(),simTime=0,ema=1/60,frames=0,lastAdj=performance.now(),ready=false,running=true,rafId=0;
renderer.compile(scene,camera);

function frame(now){
  if(!running) return;
  rafId=requestAnimationFrame(frame);
  const rawDt=(now-last)/1000;last=now;
  const dt=Math.min(rawDt,.05);
  simTime+=dt;

  shared.uTime.value=simTime;
  shared.uEnergy.value=ENERGY;
  shared.uRes.value=0;

  core.rotation.y=simTime*.03;
  assembly.rotation.y=simTime*.012;
  assembly.rotation.x=Math.sin(simTime*.045)*.035;
  ringMeshes.forEach((m,i)=>m.rotation.y=RINGS[i].phase+simTime*RINGS[i].speed);
  sky.rotation.y=simTime*.0035;
  moteGrp.rotation.y=-simTime*.006;
  halo.quaternion.copy(camera.quaternion);

  if(intro<1){
    intro=Math.min(1,intro+dt/2.8);
    camera.position.copy(DEF_POS).multiplyScalar(1.5-0.5*easeOut(intro));
  } else if(!reduced){
    const ot=Math.max(0,simTime-2.8);
    const osc=Math.min(1,ot/4);
    const a=A0+ot*.026;
    const rad=R0+Math.sin(ot*.05)*1.6*osc;
    camera.position.set(Math.sin(a)*rad, DEF_POS.y+Math.sin(ot*.037)*1.5*osc, Math.cos(a)*rad);
  }
  camera.lookAt(TARGET);
  shared.uFocus.value=camera.position.distanceTo(TARGET);

  bloom.strength=.55+ENERGY*.6;
  gradePass.uniforms.uTime.value=simTime;
  gradePass.uniforms.uExposure.value=1.02+ENERGY*.28;

  composer.render();

  /* авто-качество: тормозит — снижаем разрешение */
  if(rawDt<.25) ema+=(rawDt-ema)*.06;
  frames++;
  if(now-lastAdj>1800&&frames>60){
    if(ema>.030&&scale>.45){scale=Math.max(.45,scale*.85);applySize();}
    else if(ema<.015&&scale<(lowTier?.85:1)){scale=Math.min(lowTier?.85:1,scale*1.1);applySize();}
    lastAdj=now;
  }
  if(!ready&&frames>=2){ready=true;veil.classList.add('gone');document.body.classList.add('ready');}
}
rafId=requestAnimationFrame(frame);

/* не жжём батарею в скрытой вкладке */
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){
    running=false;cancelAnimationFrame(rafId);
    if(!music.paused){music.pause();setMusicUI(false);}
  } else if(!running){
    running=true;last=performance.now();rafId=requestAnimationFrame(frame);
  }
});
}
</script>
</body>
</html>
